; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html
;
; Her er der et miljø (env) pr. test. Vælg hvilket der skal uploades
; nederst i VS Code (env-vælgeren) eller med: pio run -e stepper -t upload

[env]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 9600

; Test af ultralydssensor (TRIG 7, ECHO 8)
[env:ultralyd]
build_src_filter = +<ultralyd_test.cpp>

; Test af 28BYJ-48 stepmotor via ULN2003 (IN1-IN4 på A0-A3)
[env:stepper]
build_src_filter = +<stepper_test.cpp>
lib_deps = arduino-libraries/Stepper

; Test af 2 DC-motorer via L298N (ENA 5, IN1 4, IN2 3, ENB 6, IN3 9, IN4 10)
[env:motorer]
build_src_filter = +<motor_test.cpp>

; Test af buzzer / lille højttaler på D12
[env:lyd]
build_src_filter = +<lyd_test.cpp>

; Afspiller sang fra MIDI (lav include/sang.h med tools/midi2melodi.js), buzzer på D12
[env:sang]
build_src_filter = +<sang_afspiller.cpp>
